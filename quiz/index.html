<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プログラミング用語クイズ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: linear-gradient(135deg, #e8f4f8 0%, #f5eef8 50%, #fef4ec 100%);
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      color: #4a4a5a;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #7b9bb2;
      margin-bottom: 2rem;
    }
    .screen {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .screen.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .start-wrap {
      text-align: center;
      padding: 3rem 1rem;
    }
    .start-wrap p {
      color: #6b6b7a;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    .btn-primary {
      background: linear-gradient(135deg, #b8d4e3, #9bc4d9);
      color: #3d5a6c;
    }
    .btn-retry {
      background: linear-gradient(135deg, #b8d4e3, #9bc4d9);
      color: #3d5a6c;
      margin-top: 1.5rem;
    }
    .progress {
      font-size: 1.3rem;
      font-weight: 600;
      color: #7b9bb2;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress .correct-count {
      color: #5a9d75;
    }
    .question-box {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(184, 212, 227, 0.6);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }
    .question-box .label {
      font-size: 0.8rem;
      color: #7b9bb2;
      margin-bottom: 0.5rem;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      text-align: left;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(184, 212, 227, 0.7);
      border-radius: 12px;
      color: #4a4a5a;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .choice:hover {
      background: rgba(184, 212, 227, 0.35);
      border-color: #9bc4d9;
    }
    .choice-label {
      flex: 1 1 auto;
      word-break: break-word;
    }
    .choice-mark {
      flex: 0 0 auto;
      min-width: 1.6rem;
      min-height: 1.6rem;
      text-align: right;
      font-size: 1.3rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .choice.correct {
      background: rgba(178, 223, 199, 0.6);
      border-color: #7bc99e;
    }
    .choice.wrong {
      background: rgba(248, 207, 207, 0.6);
      border-color: #e8a0a0;
    }
    .choice.correct .choice-mark,
    .choice.wrong .choice-mark {
      opacity: 1;
    }
    .choice.correct .choice-mark {
      color: #2e7d32;
    }
    .choice.wrong .choice-mark {
      color: #c62828;
    }
    .choice:disabled {
      cursor: default;
      opacity: 0.95;
    }
    .result-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .result-header .score {
      font-size: 2.5rem;
      font-weight: 700;
      color: #7b9bb2;
    }
    .result-header .score span { color: #5a9d75; }
    .result-list {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(184, 212, 227, 0.5);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .result-item {
      padding: 1rem;
      border-bottom: 1px solid rgba(184, 212, 227, 0.4);
      line-height: 1.5;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item .q { color: #6b6b7a; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .result-item .correct-answer { color: #5a9d75; font-weight: 600; }
    .result-item .your-answer { margin-top: 0.25rem; }
    .result-item .your-answer.wrong-answer { color: #c97b7b; }
    .result-item .your-answer.correct-answer { color: #5a9d75; }
    .result-actions { text-align: center; }
    .answer-feedback {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .answer-feedback.correct {
      background: rgba(178, 223, 199, 0.35);
      border: 1px solid #7bc99e;
      color: #2e7d32;
    }
    .answer-feedback.wrong {
      background: rgba(248, 207, 207, 0.35);
      border: 1px solid #e8a0a0;
      color: #c62828;
    }
    .mode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .btn-mode {
      min-width: 160px;
    }
    .btn-mode.hard {
      background: linear-gradient(135deg, #e8b4b8, #d9a0a8);
      color: #6b4548;
    }
    .free-answer-wrap {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .free-answer-wrap input[type="text"] {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      border: 2px solid rgba(184, 212, 227, 0.8);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: #4a4a5a;
    }
    .free-answer-wrap input[type="text"]:focus {
      outline: none;
      border-color: #9bc4d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>プログラミング用語クイズ</h1>

    <div id="start-screen" class="screen active">
      <div class="start-wrap">
        <p>プログラミング用語の「解説」を見て、正しい「用語」を答えるクイズです。<br>全10問。4択または自由記入（高難易度）を選んで挑戦しましょう。</p>
        <div class="mode-buttons">
          <button type="button" class="btn btn-primary btn-mode" id="start-choice-btn">4択</button>
          <button type="button" class="btn btn-mode hard" id="start-free-btn">自由記入</button>
        </div>
      </div>
    </div>

    <div id="quiz-screen" class="screen">
      <p class="progress" id="progress">問題 1 / 10</p>
      <div class="question-box">
        <div class="label">この解説はどの用語？</div>
        <div id="question-text"></div>
      </div>
      <div id="answer-area"></div>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-header">
        <div class="score" id="score-text">0 / 10 正解</div>
      </div>
      <div class="result-list" id="result-list"></div>
      <div class="result-actions">
        <button type="button" class="btn btn-retry" id="retry-btn">リトライ</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const TOTAL_QUESTIONS = 10;
      let allItems = [];
      let currentQuiz = [];
      let currentIndex = 0;
      let answers = [];
      let quizMode = 'choice';

      function parseCSV(text) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return [];
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          const cols = line.split(',');
          if (cols.length < 2) continue;
          const term = (cols[0] || '').replace(/^"|"$/g, '').trim();
          const explanation = (cols[1] || '').trim();
          const distractors = cols.slice(2).map(function (c) { return c.trim(); }).filter(function (c) { return c; });
          if (term && explanation) rows.push({ term: term, explanation: explanation, distractors: distractors });
        }
        return rows;
      }

      function loadCSV() {
        fetch('mino.csv')
          .then(function (res) {
            if (!res.ok) throw new Error('CSV load failed');
            return res.text();
          })
          .then(function (text) {
            allItems = parseCSV(text);
            if (allItems.length < 4) {
              alert('CSVのデータが不足しています。');
            }
          })
          .catch(function (err) {
            console.error(err);
            alert('CSVの読み込みに失敗しました。ページをサーバー経由で開いているか確認してください。');
          });
      }

      loadCSV();

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startQuiz(mode) {
        if (!allItems || allItems.length < 4) {
          alert('CSVの読み込み中です。少し待ってから再度お試しください。');
          return;
        }
        quizMode = mode;
        const shuffled = shuffle(allItems);
        currentQuiz = shuffled.slice(0, TOTAL_QUESTIONS);
        currentIndex = 0;
        answers = [];
        showScreen('quiz-screen');
        showQuestion();
      }

      function showQuestion() {
        const item = currentQuiz[currentIndex];
        const correctCount = answers.filter(function (a) { return a.correct; }).length;
        const progressEl = document.getElementById('progress');
        progressEl.innerHTML = '問題 ' + (currentIndex + 1) + ' / ' + TOTAL_QUESTIONS + 
          (currentIndex > 0 ? ' <span class="correct-count">（正解: ' + correctCount + '問）</span>' : '');
        document.getElementById('question-text').textContent = item.explanation;

        const container = document.getElementById('answer-area');
        container.innerHTML = '';

        if (quizMode === 'choice') {
          var wrongTerms;
          if (item.distractors && item.distractors.length >= 3) {
            wrongTerms = shuffle(item.distractors).slice(0, 3);
          } else {
            const others = allItems.filter(function (x) {
              return x.term !== item.term;
            });
            wrongTerms = shuffle(others).slice(0, 3).map(function (x) { return x.term; });
          }
          const choices = shuffle([item.term].concat(wrongTerms));
          const choicesDiv = document.createElement('div');
          choicesDiv.className = 'choices';
          choices.forEach(function (choice) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'choice';
            btn.dataset.term = choice;
            const labelSpan = document.createElement('span');
            labelSpan.className = 'choice-label';
            labelSpan.textContent = choice;
            const markSpan = document.createElement('span');
            markSpan.className = 'choice-mark';
            markSpan.textContent = '';
            btn.appendChild(labelSpan);
            btn.appendChild(markSpan);
            btn.addEventListener('click', function () { onAnswer(choice, btn); });
            choicesDiv.appendChild(btn);
          });
          container.appendChild(choicesDiv);
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'free-answer-wrap';
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '用語を入力';
          input.id = 'free-answer-input';
          input.setAttribute('autocomplete', 'off');
          const submitBtn = document.createElement('button');
          submitBtn.type = 'button';
          submitBtn.className = 'btn btn-primary';
          submitBtn.textContent = '回答する';
          submitBtn.addEventListener('click', function () { onFreeSubmit(input); });
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') onFreeSubmit(input);
          });
          wrap.appendChild(input);
          wrap.appendChild(submitBtn);
          container.appendChild(wrap);
          setTimeout(function () { input.focus(); }, 100);
        }
      }

      function onAnswer(selected, btnEl) {
        const item = currentQuiz[currentIndex];
        const correct = item.term === selected;
        answers.push({ index: currentIndex, question: item, selected: selected, correct: correct });

        const buttons = document.querySelectorAll('#answer-area .choice');
        buttons.forEach(function (b) {
          b.disabled = true;
          const term = b.dataset.term;
          const markSpan = b.querySelector('.choice-mark');
          if (term === item.term) {
            b.classList.add('correct');
            if (markSpan) markSpan.textContent = '◯';
          } else if (b === btnEl && !correct) {
            b.classList.add('wrong');
            if (markSpan) markSpan.textContent = '✕';
          }
        });

        if (!correct) {
          const container = document.getElementById('answer-area');
          const feedback = document.createElement('div');
          feedback.className = 'answer-feedback wrong';
          feedback.textContent = '✕ 不正解… 正解: ' + item.term;
          container.appendChild(feedback);
        }

        setTimeout(function () {
          currentIndex++;
          if (currentIndex < TOTAL_QUESTIONS) {
            showQuestion();
          } else {
            showResult();
          }
        }, 1200);
      }

      function onFreeSubmit(inputEl) {
        const item = currentQuiz[currentIndex];
        const typed = (inputEl.value || '').trim();
        const correct = typed === item.term;
        answers.push({ index: currentIndex, question: item, selected: typed, correct: correct });

        const wrap = inputEl.closest('.free-answer-wrap');
        if (wrap) {
          inputEl.disabled = true;
          inputEl.style.opacity = correct ? '1' : '1';
          if (inputEl.nextElementSibling) inputEl.nextElementSibling.disabled = true;
          var feedback = document.createElement('div');
          feedback.className = 'your-answer ' + (correct ? 'correct-answer' : 'wrong-answer');
          feedback.style.marginTop = '0.5rem';
          feedback.textContent = correct ? '正解！' : '正解: ' + item.term;
          wrap.appendChild(feedback);
        }

        setTimeout(function () {
          currentIndex++;
          if (currentIndex < TOTAL_QUESTIONS) {
            showQuestion();
          } else {
            showResult();
          }
        }, 1200);
      }

      function showResult() {
        const correctCount = answers.filter(function (a) { return a.correct; }).length;
        document.getElementById('score-text').innerHTML = '<span>' + correctCount + '</span> / ' + TOTAL_QUESTIONS + ' 正解';
        const listEl = document.getElementById('result-list');
        listEl.innerHTML = '';
        answers.forEach(function (a, i) {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML =
            '<div class="q">' + (i + 1) + '. ' + escapeHtml(a.question.explanation) + '</div>' +
            '<div class="correct-answer">正解: ' + escapeHtml(a.question.term) + '</div>' +
            '<div class="your-answer ' + (a.correct ? 'correct-answer' : 'wrong-answer') + '">' +
            (a.correct ? 'あなたの回答: ' + escapeHtml(a.selected) : 'あなたの回答: ' + escapeHtml(a.selected) + ' （不正解）') +
            '</div>';
          listEl.appendChild(div);
        });
        showScreen('result-screen');
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function showScreen(id) {
        document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
        document.getElementById(id).classList.add('active');
      }

      document.getElementById('start-choice-btn').addEventListener('click', function () { startQuiz('choice'); });
      document.getElementById('start-free-btn').addEventListener('click', function () { startQuiz('free'); });
      document.getElementById('retry-btn').addEventListener('click', function () {
        showScreen('start-screen');
      });
    })();
  </script>
</body>
</html>
