<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暇つぶしゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2em;
            z-index: 10;
        }

        #gameArea {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 14px;
            line-height: 1.4;
            color: #fff;
            z-index: 20;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #hud span.label {
            opacity: 0.7;
            margin-right: 4px;
        }

        .hima {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            cursor: pointer;
            will-change: transform, left, top;
            transform-origin: center bottom;
        }

        .hima.crushing {
            transform: scaleY(0.25);
            transition: transform 0.1s ease-out;
            transform-origin: center bottom;
        }

        .hima.crushed {
            transform: scaleY(0.25);
            transition: transform 0s;
            transform-origin: center bottom;
        }

        .hima.removing {
            opacity: 0;
            transition: opacity 0s;
        }

        .baku {
            position: absolute;
            font-size: 80px;
            font-weight: bold;
            color: #ff0000;
            user-select: none;
            pointer-events: auto;
            cursor: pointer;
            z-index: 15;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        .baku-preview {
            position: absolute;
            font-size: 80px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            user-select: none;
            pointer-events: none;
            z-index: 14;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .explosion-effect {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 14;
        }

        .explosion-wave {
            border: 3px solid rgba(255, 100, 0, 0.8);
            background: radial-gradient(circle, rgba(255, 200, 0, 0.4) 0%, rgba(255, 100, 0, 0.2) 50%, transparent 100%);
            box-shadow: 0 0 30px rgba(255, 150, 0, 0.8), inset 0 0 30px rgba(255, 200, 0, 0.4);
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        .explosion-wave {
            animation: explode 0.6s ease-out forwards;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 13;
        }

        @keyframes particle-explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .particle {
            animation: particle-explode 0.8s ease-out forwards;
        }

        .hima.exploded {
            transform: scale(2) rotate(360deg);
            opacity: 0;
            filter: brightness(2) saturate(2);
            transition: transform 0.4s ease-out, opacity 0.4s ease-out, filter 0.4s ease-out;
        }
    </style>
</head>
<body>
    <h1>暇つぶしゲーム</h1>
    <div id="hud">
        <div>
            <span class="label">経過時間</span>
            <span id="timeDisplay">0:00</span>
        </div>
        <div>
            <span class="label">潰した暇</span>
            <span id="crushCount">0</span>
        </div>
    </div>
    <div id="gameArea"></div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const crushCountDisplay = document.getElementById('crushCount');

        const MAX_HIMA = 10;
        const SPAWN_INTERVAL = 5000; // 生成間隔（5秒）

        const COLOR_CANDIDATES = [
            '#ff4b6b', // ビビッドピンク
            '#ffd93b', // 明るいイエロー
            '#4bffae', // ミントグリーン
            '#4bd5ff', // シアン
            '#ff9b4b', // オレンジ
            '#b84bff', // パープル
            '#ffffff'  // ホワイト
        ];

        let spawnTimer = null;
        let himas = [];
        let bakus = []; // 「爆」の配列

        let crushedCount = 0;
        const startTime = Date.now();

        // 長押し検出用
        let longPressTimer = null;
        let previewTimer = null;
        let isLongPressing = false;
        let previewBaku = null; // 半透明の「爆」
        const PREVIEW_DURATION = 500; // 0.5秒で半透明表示
        const LONG_PRESS_DURATION = 3000; // 3秒で完成（起爆可能になるまで）

        function getRandomColor() {
            const index = Math.floor(Math.random() * COLOR_CANDIDATES.length);
            return COLOR_CANDIDATES[index];
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return minutes + ':' + String(seconds).padStart(2, '0');
        }

        function updateHud() {
            const elapsed = Date.now() - startTime;
            timeDisplay.textContent = formatTime(elapsed);
            crushCountDisplay.textContent = crushedCount;
        }

        setInterval(updateHud, 200);

        // 「暇」オブジェクトを作成して配列で管理
        function createHima() {
            if (himas.length >= MAX_HIMA) {
                return;
            }

            const rect = gameArea.getBoundingClientRect();

            const el = document.createElement('div');
            el.className = 'hima';
            el.textContent = '暇';

            // ランダムな大きさ（フォントサイズ）
            const fontSize = 50 + Math.random() * 100; // 50px〜150px
            el.style.fontSize = fontSize + 'px';

            // ランダムな色（視認性の高い色から選択）
            el.style.color = getRandomColor();

            // 画面内のランダムな位置
            const approxWidth = fontSize;
            const approxHeight = fontSize;
            let x = Math.random() * Math.max(rect.width - approxWidth, 10);
            let y = Math.random() * Math.max(rect.height - approxHeight, 10);

            // ランダムで等速直線運動にするかどうか
            const isLinear = Math.random() < 0.35; // 約1/3を直線運動に

            // 速度（px / ms）
            const baseSpeed = 0.12 + Math.random() * 0.25; // 0.12〜0.37
            const angle = Math.random() * Math.PI * 2;
            let vx = Math.cos(angle) * baseSpeed;
            let vy = Math.sin(angle) * baseSpeed;

            const hima = {
                el,
                x,
                y,
                vx,
                vy,
                baseSpeed,
                isLinear,
                width: approxWidth,
                height: approxHeight
            };

            el.style.left = x + 'px';
            el.style.top = y + 'px';

            // クリックで潰す
            el.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!el.classList.contains('clicked') && !el.classList.contains('crushing')) {
                    // 移動を即座に停止
                    hima.vx = 0;
                    hima.vy = 0;
                    
                    // クリック済みフラグを設定
                    el.classList.add('clicked');
                    crushedCount++;
                    
                    // 素早く潰す（0.1秒）
                    el.classList.add('crushing');
                    
                    // 潰れた状態で0.5秒静止
                    setTimeout(() => {
                        el.classList.remove('crushing');
                        el.classList.add('crushed');
                        
                        // 0.5秒後にパッと消す
                        setTimeout(() => {
                            el.classList.add('removing');
                            
                            // すぐに削除
                            setTimeout(() => {
                                if (el.parentNode) {
                                    el.parentNode.removeChild(el);
                                }
                                const index = himas.indexOf(hima);
                                if (index > -1) {
                                    himas.splice(index, 1);
                                }
                                
                                // 暇が0個になったら即生成
                                if (himas.length === 0 && spawnTimer) {
                                    clearTimeout(spawnTimer);
                                    scheduleSpawn();
                                }
                            }, 0);
                        }, 500);
                    }, 100);
                }
            });

            gameArea.appendChild(el);
            himas.push(hima);
        }

        // 「暇」を定期的に生成
        function scheduleSpawn() {
            // 暇が0個の場合は即生成
            if (himas.length === 0) {
                createHima();
            }
            
            spawnTimer = setTimeout(() => {
                if (himas.length < MAX_HIMA) {
                    createHima();
                }
                scheduleSpawn();
            }, SPAWN_INTERVAL);
        }

        // ふらふら＆直線運動の更新ループ
        let lastTime = performance.now();

        function updatePositions(now) {
            const dt = now - lastTime;
            lastTime = now;

            const rect = gameArea.getBoundingClientRect();

            himas.forEach(hima => {
                // クリックされた「暇」は移動しない
                if (hima.el.classList.contains('clicked') || 
                    hima.el.classList.contains('crushing') || 
                    hima.el.classList.contains('crushed')) {
                    return;
                }
                
                if (hima.isLinear) {
                    // 等速直線運動（バウンドのみ）
                    hima.x += hima.vx * dt;
                    hima.y += hima.vy * dt;
                } else {
                    // ふらふら運動：速度ベクトルを少しずつランダムに変化させる
                    const jitterStrength = 0.0008; // 小さいほどなめらか
                    hima.vx += (Math.random() - 0.5) * jitterStrength * dt;
                    hima.vy += (Math.random() - 0.5) * jitterStrength * dt;

                    // 速度の上限を設定して暴走を防ぐ
                    const maxSpeed = hima.baseSpeed * 1.6;
                    const speed = Math.hypot(hima.vx, hima.vy);
                    if (speed > maxSpeed && speed > 0) {
                        const scale = maxSpeed / speed;
                        hima.vx *= scale;
                        hima.vy *= scale;
                    }

                    hima.x += hima.vx * dt;
                    hima.y += hima.vy * dt;
                }

                // 画面端でバウンド（直線／ふらふら共通）
                if (hima.x < 0) {
                    hima.x = 0;
                    hima.vx = Math.abs(hima.vx);
                } else if (hima.x + hima.width > rect.width) {
                    hima.x = rect.width - hima.width;
                    hima.vx = -Math.abs(hima.vx);
                }

                if (hima.y < 0) {
                    hima.y = 0;
                    hima.vy = Math.abs(hima.vy);
                } else if (hima.y + hima.height > rect.height) {
                    hima.y = rect.height - hima.height;
                    hima.vy = -Math.abs(hima.vy);
                }

                hima.el.style.left = hima.x + 'px';
                hima.el.style.top = hima.y + 'px';
            });

            requestAnimationFrame(updatePositions);
        }

        requestAnimationFrame((now) => {
            lastTime = now;
            updatePositions(now);
        });

        // 画面サイズ変更時ははみ出ている「暇」を内側に押し戻す
        window.addEventListener('resize', () => {
            const rect = gameArea.getBoundingClientRect();
            himas.forEach(hima => {
                if (hima.x + hima.width > rect.width) {
                    hima.x = Math.max(rect.width - hima.width, 0);
                }
                if (hima.y + hima.height > rect.height) {
                    hima.y = Math.max(rect.height - hima.height, 0);
                }
                hima.el.style.left = hima.x + 'px';
                hima.el.style.top = hima.y + 'px';
            });
        });

        // 爆発エフェクトを作成
        function createExplosionEffect(centerX, centerY, radius) {
            // 波紋エフェクト（複数層）
            for (let i = 0; i < 3; i++) {
                const wave = document.createElement('div');
                wave.className = 'explosion-effect explosion-wave';
                wave.style.width = radius * 2 + 'px';
                wave.style.height = radius * 2 + 'px';
                wave.style.left = (centerX - radius) + 'px';
                wave.style.top = (centerY - radius) + 'px';
                wave.style.animationDelay = (i * 0.1) + 's';
                gameArea.appendChild(wave);
                
                setTimeout(() => {
                    if (wave.parentNode) {
                        wave.parentNode.removeChild(wave);
                    }
                }, 600 + (i * 100));
            }

            // パーティクルエフェクト
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const angle = (Math.PI * 2 / particleCount) * i;
                const distance = radius * (0.5 + Math.random() * 0.5);
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                // ランダムな色（オレンジ〜赤系）
                const colors = ['#ff6600', '#ff3300', '#ff9900', '#ffcc00', '#ff0000'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 10px ${particle.style.backgroundColor}`;
                
                gameArea.appendChild(particle);
                
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 800);
            }
        }

        // 「爆」を作成（完成版）
        function createBaku(x, y) {
            const baku = document.createElement('div');
            baku.className = 'baku';
            baku.textContent = '爆';
            baku.style.left = x + 'px';
            baku.style.top = y + 'px';

            // クリックで周囲の「暇」を爆破
            baku.addEventListener('click', function (e) {
                e.stopPropagation();
                const bakuX = x + 40; // 中心位置を計算（フォントサイズ80pxの中心）
                const bakuY = y + 40;
                const explosionRadius = 400; // 爆破範囲（px）- 2倍に拡大

                // 爆発エフェクトを生成
                createExplosionEffect(bakuX, bakuY, explosionRadius);

                // 周囲の「暇」を検出して爆破
                const himasToRemove = [];
                himas.forEach(hima => {
                    if (!hima.el.classList.contains('clicked') && !hima.el.classList.contains('exploded')) {
                        const himaCenterX = hima.x + hima.width / 2;
                        const himaCenterY = hima.y + hima.height / 2;
                        const distance = Math.hypot(
                            himaCenterX - bakuX,
                            himaCenterY - bakuY
                        );

                        if (distance <= explosionRadius) {
                            himasToRemove.push(hima);
                        }
                    }
                });

                // 爆破された「暇」を削除（派手なエフェクト付き）
                crushedCount += himasToRemove.length;
                himasToRemove.forEach((hima, index) => {
                    if (!hima.el.classList.contains('clicked') && !hima.el.classList.contains('exploded')) {
                        hima.el.classList.add('exploded');
                        
                        // 少しずつタイミングをずらしてエフェクトを表示
                        setTimeout(() => {
                            if (hima.el.parentNode) {
                                hima.el.parentNode.removeChild(hima.el);
                            }
                            const idx = himas.indexOf(hima);
                            if (idx > -1) {
                                himas.splice(idx, 1);
                            }
                            
                            // 暇が0個になったら即生成
                            if (himas.length === 0 && spawnTimer) {
                                clearTimeout(spawnTimer);
                                scheduleSpawn();
                            }
                        }, 400 + (index * 20));
                    }
                });

                // 「爆」自体も削除
                setTimeout(() => {
                    if (baku.parentNode) {
                        baku.parentNode.removeChild(baku);
                    }
                    const bakuIndex = bakus.indexOf(baku);
                    if (bakuIndex > -1) {
                        bakus.splice(bakuIndex, 1);
                    }
                }, 100);
            });

            gameArea.appendChild(baku);
            bakus.push(baku);
        }

        // 半透明の「爆」を作成（プレビュー）
        function createPreviewBaku(x, y) {
            if (previewBaku && previewBaku.parentNode) {
                previewBaku.parentNode.removeChild(previewBaku);
            }
            
            previewBaku = document.createElement('div');
            previewBaku.className = 'baku-preview';
            previewBaku.textContent = '爆';
            previewBaku.style.left = x + 'px';
            previewBaku.style.top = y + 'px';
            
            gameArea.appendChild(previewBaku);
        }

        // 長押し開始
        function startLongPress(e) {
            if (e.button !== 0) return; // 左クリックのみ
            isLongPressing = true;
            const x = e.clientX;
            const y = e.clientY;

            // 0.5秒後に半透明の「爆」を表示
            previewTimer = setTimeout(() => {
                if (isLongPressing) {
                    createPreviewBaku(x - 40, y - 40);
                }
            }, PREVIEW_DURATION);

            // 3秒後に赤い「爆」を完成させる
            longPressTimer = setTimeout(() => {
                if (isLongPressing) {
                    // 半透明の「爆」を削除
                    if (previewBaku && previewBaku.parentNode) {
                        previewBaku.parentNode.removeChild(previewBaku);
                        previewBaku = null;
                    }
                    // 赤い「爆」を生成
                    createBaku(x - 40, y - 40);
                    isLongPressing = false;
                }
            }, LONG_PRESS_DURATION);
        }

        // 長押しキャンセル
        function cancelLongPress() {
            if (previewTimer) {
                clearTimeout(previewTimer);
                previewTimer = null;
            }
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            // 半透明の「爆」を削除
            if (previewBaku && previewBaku.parentNode) {
                previewBaku.parentNode.removeChild(previewBaku);
                previewBaku = null;
            }
            isLongPressing = false;
        }

        // マウスイベント設定
        gameArea.addEventListener('mousedown', startLongPress);
        gameArea.addEventListener('mouseup', cancelLongPress);
        gameArea.addEventListener('mouseleave', cancelLongPress);

        // ゲーム開始
        createHima();
        scheduleSpawn();
    </script>
</body>
</html>
